name: 🔄 Daily SEO Auto-Update

# ══════════════════════════════════════════════════════════════
# T-Mat Global — Daily RSS + Sitemap Auto-Updater
# Runs every day at 6:00 AM IST (00:30 UTC)
# Updates:
#   ✅ rss.xml     — lastBuildDate refreshed to today
#   ✅ sitemap.xml — all <lastmod> dates refreshed to today
#   ✅ Commits and pushes automatically to main branch
# ══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 0 * * *'   # 6:00 AM IST = 00:30 UTC every day

  workflow_dispatch:         # ✅ Also allows manual trigger from GitHub UI

jobs:
  update-seo-files:
    name: Update RSS & Sitemap Dates
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Get today's date in both formats needed
      - name: Set Today's Date
        run: |
          echo "TODAY_ISO=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "TODAY_RFC=$(date -u '+%a, %d %b %Y 00:00:00 GMT')" >> $GITHUB_ENV

      # 3. Update rss.xml — replace lastBuildDate with today
      - name: Update rss.xml lastBuildDate
        run: |
          sed -i "s|<lastBuildDate>.*</lastBuildDate>|<lastBuildDate>${{ env.TODAY_RFC }}</lastBuildDate>|g" rss.xml
          echo "✅ rss.xml updated: ${{ env.TODAY_RFC }}"

      # 4. Update sitemap.xml — replace ALL lastmod dates with today
      - name: Update sitemap.xml lastmod dates
        run: |
          sed -i "s|<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>|<lastmod>${{ env.TODAY_ISO }}</lastmod>|g" sitemap.xml
          echo "✅ sitemap.xml updated: ${{ env.TODAY_ISO }}"

      # 5. Check if anything actually changed
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # 6. Commit and push only if files changed
      - name: Commit & Push Updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "T-Mat Global SEO Bot"
          git config user.email "hr@t-matglobal.com"
          git add rss.xml sitemap.xml
          git commit -m "chore: daily SEO update — ${{ env.TODAY_ISO }}"
          git push
          echo "✅ Pushed to repo"

      # 7. Log if nothing changed (shouldn't happen)
      - name: No Changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "ℹ️ No changes detected — files already up to date"